name: PREHW reset-safe R1A v3 check

on:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  patch-and-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison libssl-dev libelf-dev bc jq

      - name: Fetch pinned Linux tree
        run: |
          set -euxo pipefail
          git init linux
          cd linux
          git remote add origin https://github.com/torvalds/linux.git
          git fetch --depth=1 origin f5a7e2ae5f0a9a5caf59501457938eeb249a7dc8
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = f5a7e2ae5f0a9a5caf59501457938eeb249a7dc8

      - name: Apply preserved v1 measurement base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/gsmarcil/DWC2/contents/instr/0001-dwc2-r1-linear-lifetime-tracepoints.patch?ref=ccf49e5c0cf20f17bcc96465b2a3e37392cf49cb" \
            | jq -r .content | tr -d '\n' | base64 -d > v1.patch
          test -s v1.patch
          cd linux
          git apply --check ../v1.patch
          git apply ../v1.patch

      - name: Reconstruct build-green v2 observer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/gsmarcil/DWC2/contents/.github/scripts/prehw_instr_v2.py?ref=2e7b4fd3d7c0e43f785027fb6885d4103020d682" \
            | jq -r .content | tr -d '\n' | base64 -d > prehw_instr_v2.py
          test -s prehw_instr_v2.py
          python3 prehw_instr_v2.py
          python3 - <<'PY'
          from pathlib import Path
          g = Path('linux/drivers/usb/dwc2/gadget.c')
          s = g.read_text()
          a = s.index('static void dwc2_r1_measure_reset(struct dwc2_hsotg_req *hs_req)')
          b = s.index('/**\n * dwc2_gadget_incr_frame_num', a)
          s = s[:a] + s[a:b].replace('\\t', '\t') + s[b:]
          g.write_text(s)
          t = Path('linux/drivers/usb/dwc2/trace-r1.h')
          t.write_text(t.read_text().replace('\\t', '\t'))
          PY

      - name: Add reset-safe v3 witness
        run: python3 .github/scripts/prehw_reset_v3.py

      - name: Semantic fail-closed checks
        run: |
          set -euxo pipefail
          cd linux
          git diff --check

          ADDED="$(git diff -U0 | grep '^+' | grep -v '^+++' || true)"
          if printf '%s\n' "$ADDED" | grep -E 'dwc2_(write|set_bit).*DOEPINT'; then
            echo 'FAIL: instrumentation adds a DOEPINT write'
            exit 1
          fi
          if printf '%s\n' "$ADDED" | grep -E 'DXEPCTL_(SNAK|EPDIS)'; then
            echo 'FAIL: reset instrumentation adds a quiesce action'
            exit 1
          fi

          test "$(printf '%s\n' "$ADDED" | grep -c 'dwc2_hsotg_map_dma(' || true)" -eq 0
          test "$(printf '%s\n' "$ADDED" | grep -c 'dwc2_hsotg_unmap_dma(' || true)" -eq 0
          test "$(grep -n 'r1_program_id++' drivers/usb/dwc2/gadget.c | wc -l)" -eq 1
          test "$(grep -n 'r1_reset_id = reset_id' drivers/usb/dwc2/gadget.c | wc -l)" -eq 1
          test "$(grep -n 'DWC2_R1_RESET_ENTRY' drivers/usb/dwc2/gadget.c | wc -l)" -ge 2
          test -z "$(git diff -- drivers/usb/dwc2/core.c)"
          ! grep -n 'dwc2_r1_' drivers/usb/dwc2/core.c

          python3 - <<'PY'
          from pathlib import Path
          s = Path('drivers/usb/dwc2/gadget.c').read_text()
          # reset lineage must be captured before disconnect retires ep->req
          a = s.index('dwc2_r1_measure_reset_entry(hsotg, gintsts);')
          b = s.index('dwc2_hsotg_disconnect(hsotg);', a)
          assert a < b
          # UNMAP_DONE snapshot must remain after the real unmap call
          u = s.index('dwc2_hsotg_unmap_dma(hsotg, hs_ep, hs_req);')
          d = s.index('DWC2_R1_UNMAP_DONE', u)
          assert u < d
          # no instrumentation inside the natural polling helper
          assert 'dwc2_r1_' not in Path('drivers/usb/dwc2/core.c').read_text()
          # reset-safe observer has one reset-entry hook and leaves IRQ ordering intact
          assert s.count('dwc2_r1_measure_reset_entry(hsotg, gintsts);') == 1
          PY

      - name: Build with measurement disabled
        run: |
          set -euxo pipefail
          cd linux
          make defconfig
          scripts/config --enable USB
          scripts/config --enable USB_GADGET
          scripts/config --enable USB_DWC2
          scripts/config --enable USB_DWC2_DUAL_ROLE
          scripts/config --enable TRACING
          scripts/config --disable USB_DWC2_R1_MEASURE
          make olddefconfig
          grep '^# CONFIG_USB_DWC2_R1_MEASURE is not set' .config
          make -j2 drivers/usb/dwc2/

      - name: Build with measurement enabled
        run: |
          set -euxo pipefail
          cd linux
          make clean
          scripts/config --enable USB_DWC2_R1_MEASURE
          make olddefconfig
          grep '^CONFIG_USB_DWC2_R1_MEASURE=y' .config
          make -j2 drivers/usb/dwc2/

      - name: Package complete standalone patch
        run: |
          set -euxo pipefail
          cd linux
          # v1 created trace-r1.h as an untracked file. Intent-to-add is required
          # so the final evidence patch contains that new file and is standalone.
          git add -N drivers/usb/dwc2/trace-r1.h
          git diff --binary > ../R1A-RESET-INSTRUMENTATION-v3.patch
          test -s ../R1A-RESET-INSTRUMENTATION-v3.patch
          grep -q '^diff --git a/drivers/usb/dwc2/trace-r1.h b/drivers/usb/dwc2/trace-r1.h' ../R1A-RESET-INSTRUMENTATION-v3.patch

          git worktree add --detach ../linux-verify HEAD
          cd ../linux-verify
          git apply --check ../R1A-RESET-INSTRUMENTATION-v3.patch
          git apply ../R1A-RESET-INSTRUMENTATION-v3.patch
          test -f drivers/usb/dwc2/trace-r1.h
          git diff --check

      - name: Write receipt
        run: |
          set -euxo pipefail
          {
            echo "kernel_pin=f5a7e2ae5f0a9a5caf59501457938eeb249a7dc8"
            echo "v1_base_commit=ccf49e5c0cf20f17bcc96465b2a3e37392cf49cb"
            echo "v2_transform_commit=2e7b4fd3d7c0e43f785027fb6885d4103020d682"
            echo "workflow_commit=${GITHUB_SHA}"
            echo "standalone_apply=PASS"
            echo "build_measurement_disabled=PASS"
            echo "build_measurement_enabled=PASS"
            sha256sum R1A-RESET-INSTRUMENTATION-v3.patch
          } > R1A-RESET-INSTRUMENTATION-v3.RECEIPT.txt

      - uses: actions/upload-artifact@v4
        with:
          name: r1a-reset-instrumentation-v3
          path: |
            R1A-RESET-INSTRUMENTATION-v3.patch
            R1A-RESET-INSTRUMENTATION-v3.RECEIPT.txt
