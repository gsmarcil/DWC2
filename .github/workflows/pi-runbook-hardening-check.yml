name: Verify Pi runbook hardening

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Repository gate
        run: ./VERIFY-REPOSITORY.sh
      - name: Pi runbook semantic checks
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/hardware/PI-ZERO-2W-COMMANDS.md')
          s = p.read_text()

          required = [
              '/proc/sys/kernel/random/boot_id',
              '$OUT/boot_id.txt',
              '$OUT/dtb_hash.txt',
              'GHWCFG4_UNPARSEABLE=',
              'GHWCFG4_NOT_CAPTURED',
              'G_DMA_DESC_EFFECTIVE=',
              'AMBIGUOUS_REGISTER_DRIVER_MISMATCH',
              'dwc2-module-udc-before.txt',
              'dwc2-module-udc-after.txt',
              'kernel_source_head=',
              'git status --porcelain=v1',
              'KERNEL_BUILD_TREE_DIRTY — REFUSED',
              'CTRL-IDLE',
              'CTRL-COMPLETED',
              'CAMPAIGN-LIVE',
          ]
          for token in required:
              assert token in s, token

          # The original boot state must be captured before modprobe can change it.
          before = s.index('dwc2-module-udc-before.txt')
          modprobe = s.index('sudo modprobe dwc2', before)
          after = s.index('dwc2-module-udc-after.txt', modprobe)
          assert before < modprobe < after

          # A register decode must be guarded by the explicit 0x-prefix case.
          case = s.index('case "$GHWCFG4_HEX" in')
          arithmetic = s.index('GHWCFG4_DESC_DMA="$(( (GHWCFG4_HEX >> 30) & 1 ))"')
          assert case < arithmetic
          assert '0x*|0X*) ;;' in s[case:arithmetic]

          # Driver/register disagreement is not allowed to become a binary verdict.
          mismatch = s.index('PI_FB2_DESC_DMA_STATUS=AMBIGUOUS_REGISTER_DRIVER_MISMATCH')
          interpretation = s.index('GHWCFG4.DESC_DMA != g_dma_desc')
          assert mismatch < interpretation

          # Overlay reboot creates a new boot/DT epoch, never reusing the old hash.
          overlay = s.index('sudo reboot')
          post = s.index('After reboot, start a NEW `$OUT` directory', overlay)
          assert 'dtb_hash.txt' in s[post:]
          assert 'Never merge pre-overlay and post-overlay evidence' in s[post:]

          # Campaign order is fail-closed on both controls.
          ci = s.rindex('CTRL-IDLE')
          cc = s.rindex('CTRL-COMPLETED')
          live = s.rindex('CAMPAIGN-LIVE')
          assert ci < cc < live
          PY
