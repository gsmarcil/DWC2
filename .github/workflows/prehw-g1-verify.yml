name: prehw-g1-verify

on:
  push:
    branches: [ prehw-g1 ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Toolchain
        run: |
          set -euxo pipefail
          python3 --version
          cc --version | head -n 1
      - name: Holder structural contract
        run: python3 verify_holder_contract.py
      - name: Holder contract discriminating controls
        run: python3 verify_holder_contract_selftest.py
      - name: Holder log guard controls
        run: python3 holder_log_guard_selftest.py
      - name: Real producer-to-merger round trip
        run: python3 holder_roundtrip.py
      - name: Repository gate
        run: ./VERIFY-REPOSITORY.sh
