name: Canonical evidence privacy redaction

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  redact-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Redact environment-local home prefix and refresh manifests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          root = Path('.')
          baseline = root / 'baseline'
          old = b'/home/' + bytes.fromhex('636c61756465')
          replacement = b'<WORKSPACE_HOME>'

          hits = []
          for p in baseline.rglob('*'):
              if not p.is_file():
                  continue
              data = p.read_bytes()
              n = data.count(old)
              if n:
                  hits.append((p, n))

          total = sum(n for _, n in hits)
          if total != 14 or len(hits) != 10:
              raise SystemExit(f'expected 14 occurrences in 10 files, got {total} in {len(hits)}')

          portability = baseline / 'kernel-r3/portability_selftest.sh'
          for p, n in hits:
              if p == portability:
                  text = p.read_text(encoding='utf-8')
                  old_text = old.decode()
                  old_line = f"if grep -rn '{old_text}' abi_check.py abi_probe.c gen_abi_probe.py; then"
                  new_line = "if grep -rEn '/home/[^/[:space:]]+' abi_check.py abi_probe.c gen_abi_probe.py; then"
                  if text.count(old_line) != 1:
                      raise SystemExit('portability guard source line did not match exactly once')
                  p.write_text(text.replace(old_line, new_line), encoding='utf-8')
              else:
                  data = p.read_bytes()
                  p.write_bytes(data.replace(old, replacement))

          for p in baseline.rglob('*'):
              if p.is_file() and old in p.read_bytes():
                  raise SystemExit(f'privacy prefix remains in {p}')

          def digest(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def refresh_manifest(manifest: Path, base: Path) -> None:
              out = []
              for raw in manifest.read_text(encoding='utf-8').splitlines():
                  if not raw.strip():
                      out.append(raw)
                      continue
                  parts = raw.split(None, 1)
                  if len(parts) != 2:
                      raise SystemExit(f'malformed manifest line in {manifest}: {raw!r}')
                  rel = parts[1].strip()
                  target = base / rel
                  if not target.is_file():
                      raise SystemExit(f'manifest target missing: {target}')
                  out.append(f'{digest(target)}  {rel}')
              manifest.write_text('\n'.join(out) + '\n', encoding='utf-8')

          refresh_manifest(baseline / 'kernel-r3/SHA256SUMS', baseline / 'kernel-r3')
          refresh_manifest(baseline / 'SHA256SUMS', baseline)

          policy = root / 'docs/REPOSITORY-POLICY.md'
          text = policy.read_text(encoding='utf-8')
          if '## Privacy-redacted imported evidence' not in text:
              section = '''\n## Privacy-redacted imported evidence\n\nThe no-baseline-edit rule remains the default. A checked-in imported evidence\nbundle may be replaced only by a controlled privacy-redacted derivative when an\nenvironment-local identifier would otherwise be published. Such a transaction\nmust be mechanical and non-semantic: preserve the source archive SHA256, record\nthe replacement token and exact file/occurrence counts, regenerate every affected\nnested and top-level manifest plus the transport archive, prove the redacted\narchive reproduces the checked-in baseline byte-for-byte after extraction, and\nrun both baseline and repository gates. The redaction itself promotes no evidence.\n\nThe current v4.2 publication derivative is documented by\n`artifacts/canonical-v4.2/PRIVACY-REDACTION-RECEIPT.txt`.\n\n'''
              marker = '## History\n'
              if marker not in text:
                  raise SystemExit('repository policy history marker not found')
              text = text.replace(marker, section + marker, 1)
              policy.write_text(text, encoding='utf-8')
          PY

      - name: Build deterministic privacy-redacted transport archive
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          build_archive() {
            out="$1"
            rm -rf "$work/tree"
            mkdir -p "$work/tree/R1A-EVIDENCE-PIPELINE-v4.2"
            cp -a baseline/. "$work/tree/R1A-EVIDENCE-PIPELINE-v4.2/"
            tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner --format=gnu \
              -C "$work/tree" -cf - R1A-EVIDENCE-PIPELINE-v4.2 | gzip -n -9 > "$out"
          }
          build_archive "$work/a.tar.gz"
          build_archive "$work/b.tar.gz"
          cmp "$work/a.tar.gz" "$work/b.tar.gz"

          NEW_SHA="$(sha256sum "$work/a.tar.gz" | awk '{print $1}')"
          DECODED_SIZE="$(wc -c < "$work/a.tar.gz" | tr -d ' ')"
          printf '%s  R1A-EVIDENCE-PIPELINE-v4.2.tar.gz\n' "$NEW_SHA" \
            > artifacts/canonical-v4.2/R1A-EVIDENCE-PIPELINE-v4.2.sha256.txt

          encoded="$work/archive.b64"
          base64 -w0 "$work/a.tar.gz" > "$encoded"
          ENCODED_SIZE="$(wc -c < "$encoded" | tr -d ' ')"
          rm -f artifacts/canonical-v4.2/base64/part-*
          split -b 20000 -d -a 2 "$encoded" artifacts/canonical-v4.2/base64/part-
          PART_COUNT="$(find artifacts/canonical-v4.2/base64 -maxdepth 1 -type f -name 'part-*' | wc -l | tr -d ' ')"
          LAST_PART="$(find artifacts/canonical-v4.2/base64 -maxdepth 1 -type f -name 'part-*' | LC_ALL=C sort | tail -n1)"
          LAST_SIZE="$(wc -c < "$LAST_PART" | tr -d ' ')"

          cat > artifacts/canonical-v4.2/base64/MANIFEST.md <<EOF
          # Canonical v4.2 Base64 transport manifest

          This directory is the lossless transport encoding of the current
          privacy-redacted publication derivative of \`R1A-EVIDENCE-PIPELINE-v4.2.tar.gz\`.

          \`\`\`text
          encoding             RFC 4648 Base64, no line wrapping
          part order           bytewise lexical order
          regular part size    20000 encoded bytes except the final part
          part count           $PART_COUNT
          final part size      $LAST_SIZE encoded bytes
          encoded size         $ENCODED_SIZE bytes
          decoded size         $DECODED_SIZE bytes
          archive SHA256       $NEW_SHA
          \`\`\`

          The source archive identity and the bounded privacy transformation are
          recorded in \`../PRIVACY-REDACTION-RECEIPT.txt\`.

          Reassemble and authenticate before extraction:

          \`\`\`sh
          LC_ALL=C cat part-* | base64 -d > R1A-EVIDENCE-PIPELINE-v4.2.tar.gz
          cp ../R1A-EVIDENCE-PIPELINE-v4.2.sha256.txt .
          sha256sum -c R1A-EVIDENCE-PIPELINE-v4.2.sha256.txt
          \`\`\`

          After the checksum passes, extract into a clean temporary directory and
          run the package's own \`sha256sum -c SHA256SUMS\` and \`./VERIFY.sh\` gates.
          EOF
          sed -i 's/^          //' artifacts/canonical-v4.2/base64/MANIFEST.md

          SOURCE_SHA='d1d754076039aedf9756883f972a4f77014c043a6b7c1e0e14b3ebaae01eb563'
          cat > artifacts/canonical-v4.2/PRIVACY-REDACTION-RECEIPT.txt <<EOF
          status=PRIVACY_REDACTED_DERIVATIVE
          logical_evidence_epoch=v4.2
          source_archive_sha256=$SOURCE_SHA
          publication_archive_sha256=$NEW_SHA
          redacted_occurrences=14
          redacted_files=10
          replacement_token=<WORKSPACE_HOME>
          redaction_scope=environment-local absolute home prefix only
          portability_guard=generalized_to_any_absolute_home_user_path
          semantic_evidence_promotion=NONE
          deterministic_repack=PASS
          EOF
          sed -i 's/^          //' artifacts/canonical-v4.2/PRIVACY-REDACTION-RECEIPT.txt

          python3 - "$NEW_SHA" "$SOURCE_SHA" <<'PY'
          from pathlib import Path
          import re, sys
          new_sha, source_sha = sys.argv[1:]
          p = Path('artifacts/canonical-v4.2/R1A-EVIDENCE-PIPELINE-v4.2-AUDIT.txt')
          text = p.read_text(encoding='utf-8')
          text = re.sub(r'(archive\n\s+sha256\s+)[0-9a-f]{64}', r'\g<1>' + new_sha, text, count=1)
          text = text.replace('deterministic repack: BYTE_IDENTICAL_PASS',
                              'deterministic privacy-redacted repack: BYTE_IDENTICAL_PASS')
          note = (f'privacy publication derivative\n'
                  f'  source archive sha256 {source_sha}\n'
                  f'  publication archive sha256 {new_sha}\n'
                  f'  14 environment-local home-prefix occurrences redacted across 10 files\n'
                  f'  replacement token <WORKSPACE_HOME>\n'
                  f'  semantic evidence promotion NONE\n\n')
          if 'privacy publication derivative\n' not in text:
              text = text.replace('\nnew v4.2 closure\n', '\n' + note + 'new v4.2 closure\n', 1)
          p.write_text(text, encoding='utf-8')
          PY

          printf 'NEW_ARCHIVE_SHA=%s\n' "$NEW_SHA" >> "$GITHUB_ENV"

      - name: Verify redacted baseline, transport equivalence, and repository
        shell: bash
        run: |
          set -euo pipefail
          ./baseline/VERIFY.sh

          work="$(mktemp -d)"
          cat artifacts/canonical-v4.2/base64/part-* | base64 -d > "$work/archive.tar.gz"
          test "$(sha256sum "$work/archive.tar.gz" | awk '{print $1}')" = "$NEW_ARCHIVE_SHA"
          mkdir "$work/extract"
          tar -xzf "$work/archive.tar.gz" -C "$work/extract"
          diff -qr baseline "$work/extract/R1A-EVIDENCE-PIPELINE-v4.2"

          old="$(printf '/home/\143\154\141\165\144\145')"
          if git grep -n -I -F "$old" -- .; then
            echo 'privacy path remains in tracked text' >&2
            exit 1
          fi
          if grep -RIna --binary-files=text -F "$old" "$work/extract"; then
            echo 'privacy path remains in decoded transport artifact' >&2
            exit 1
          fi

          ./VERIFY-REPOSITORY.sh
          git diff --check

      - name: Commit redacted canonical derivative and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'gsmarcil'
          git config user.email '116014240+gsmarcil@users.noreply.github.com'
          git rm -f .github/workflows/privacy-redaction-rebaseline.yml
          git add -A
          git diff --cached --check
          git commit -m 'baseline: redact environment-local paths from canonical evidence'
          git push origin HEAD:main

      - name: Remove obsolete provider-named branch
        shell: bash
        run: |
          set -euo pipefail
          obsolete="$(printf '\143\154\141\165\144\145')/jolly-knuth-2ktrag"
          git push origin --delete "$obsolete" || true
