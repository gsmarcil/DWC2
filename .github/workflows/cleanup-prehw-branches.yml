name: cleanup-prehw-branches

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve exact WIP tips and delete temporary branches
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          expect_ref() {
            ref="$1"
            want="$2"
            got="$(git ls-remote origin "$ref" | awk '{print $1}')"
            test "$got" = "$want"
          }

          expect_ref refs/heads/prehw-g1 15fca0f37c6080f6ab818bcfaed19f46cbb6cf77
          expect_ref refs/heads/prehw-instr 8191fd42c816d1581d4a5cf2287c7e02f71d9d8a
          expect_ref refs/heads/prehw-surface eda2ce22712d35fa2cbb71164c904412b94bce8f
          expect_ref refs/tags/EPOCH-PREHW-1 15fca0f37c6080f6ab818bcfaed19f46cbb6cf77

          preserve_tag() {
            tag="$1"
            sha="$2"
            existing="$(git ls-remote --tags origin "refs/tags/$tag" | awk '{print $1}')"
            if [ -n "$existing" ]; then
              test "$existing" = "$sha"
              return
            fi
            git tag "$tag" "$sha"
            git push origin "refs/tags/$tag"
          }

          preserve_tag WIP-PREHW-INSTR-8191fd4 8191fd42c816d1581d4a5cf2287c7e02f71d9d8a
          preserve_tag WIP-PREHW-SURFACE-eda2ce2 eda2ce22712d35fa2cbb71164c904412b94bce8f

          git push origin --delete prehw-g1 prehw-instr prehw-surface

          test -z "$(git ls-remote --heads origin prehw-g1)"
          test -z "$(git ls-remote --heads origin prehw-instr)"
          test -z "$(git ls-remote --heads origin prehw-surface)"
          echo "PREHW_BRANCH_CLEANUP: PASS"
